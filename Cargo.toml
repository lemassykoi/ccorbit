[package]
name = "ccorbit"
version = "0.1.0"
edition = "2024"
authors = ["Pierre CANGEMI"]
description = "A live, read-only terminal view of every Claude Code session on this machine: wall, 3D HUD, code city"
repository = "https://github.com/pcangemi/ccorbit"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "monitoring", "terminal"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
